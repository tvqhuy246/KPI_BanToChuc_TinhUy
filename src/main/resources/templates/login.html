<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Ban Tổ chức Tỉnh ủy Đắk Lắk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card border-0">
                    <div class="dang-header login-header-glow text-center p-4">
                        <img src="https://cdn11.dienmaycholon.vn/filewebdmclnew/public/userupload/files/kkt/ngoi-sao-vang-va-voi-hinh-nen-trong-dong-675.jpg" alt="Logo" class="rounded-circle shadow-sm mb-2 border border-2 border-warning" style="width: 75px; height: 75px; object-fit: cover;">
                        <h2 class="h5 text-white fw-bold text-uppercase mb-1">Ban Tổ chức Tỉnh ủy Đắk Lắk</h2>
                        <p class="small text-warning mb-0">HỆ THỐNG ĐÁNH GIÁ KẾT QUẢ THỰC HIỆN NHIỆM VỤ (KPI)</p>
                    </div>
                    <div class="card-body p-4 p-md-5 bg-white">
                        <div th:if="${error}" class="alert alert-danger py-2 small d-flex align-items-center mb-4">
                            <i class="fa-solid fa-triangle-exclamation me-2"></i>
                            <span th:text="${error}">Sai thông tin đăng nhập!</span>
                        </div>
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label text-secondary fw-semibold small">Tên đăng nhập</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                                    <input type="text" name="username" class="form-control bg-light" placeholder="Nhập tên đăng nhập" required autofocus>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-secondary fw-semibold small">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                                    <input type="password" name="password" class="form-control bg-light" placeholder="Nhập mật khẩu" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-danger w-100 py-2 fw-bold" style="background-color: var(--primary-red);">
                                <i class="fa-solid fa-right-to-bracket me-2"></i> ĐĂNG NHẬP
                            </button>
                        </form>
                        <div class="mt-4 pt-3 border-top">
                            <p class="small text-muted mb-2 fw-semibold">Tài khoản mẫu kiểm thử (Mật khẩu: password123):</p>
                            <div class="d-flex flex-wrap gap-1">
                                <span class="badge bg-secondary p-2">lanhdao (Lãnh đạo Ban)</span>
                                <span class="badge bg-secondary p-2">tp_canbo (Trưởng phòng)</span>
                                <span class="badge bg-secondary p-2">cntt_user (CV CNTT)</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
